[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "podcatcher"
version = "0.1.0"
description = "A simple command-line podcast catcher"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "feedparser",
    "httpx",
    "python-vlc",
]

[project.scripts]
podcatcher = "podcatcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

